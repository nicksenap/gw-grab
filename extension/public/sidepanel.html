<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Grove Grab</title>
    <style>
      :root { color-scheme: light dark; --fg: #1a1a1a; --muted: #6b7280; --accent: #2f7d4f; --border: #d1d5db; }
      @media (prefers-color-scheme: dark) { :root { --fg: #e5e7eb; --muted: #9ca3af; --border: #374151; } }
      body { font: 13px/1.5 system-ui, sans-serif; margin: 0; padding: 14px; color: var(--fg); }
      h1 { font-size: 14px; margin: 0 0 12px; display: flex; align-items: center; gap: 6px; }
      label { display: block; font-size: 11px; color: var(--muted); margin: 10px 0 3px; text-transform: uppercase; letter-spacing: .04em; }
      input, select { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; background: transparent; color: var(--fg); font: inherit; }
      .source { font-size: 12px; color: var(--muted); word-break: break-all; margin-bottom: 4px; }
      .badge { display: inline-block; font-size: 10px; background: var(--accent); color: #fff; padding: 1px 6px; border-radius: 10px; }
      .track { font-size: 11px; color: var(--accent); }
      button { margin-top: 14px; width: 100%; padding: 9px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
      button:disabled { opacity: .5; cursor: default; }
      .notes { margin-top: 10px; font-size: 11px; color: var(--muted); }
      .notes li { margin: 2px 0; }
      .status { margin-top: 12px; font-size: 12px; }
      .error { color: #b91c1c; }
      .ok { color: var(--accent); }
      .hidden { display: none; }
      #empty { color: var(--muted); }
    </style>
  </head>
  <body>
    <h1>🌳 Grove Grab</h1>

    <div id="empty">Right-click a page → <em>Grab into Grove</em>, or click the toolbar icon.</div>

    <div id="capturing" class="hidden status">Reading the page…</div>

    <form id="plan" class="hidden">
      <div class="source"><span id="provider" class="badge"></span> <span id="sourceTitle"></span></div>
      <div class="source" id="sourceUrl"></div>

      <label for="repo">Repository</label>
      <select id="repo"></select>

      <label for="branch">Branch <span id="trackTag" class="track hidden">· check out existing</span></label>
      <input id="branch" type="text" autocomplete="off" />

      <label for="name">Workspace name</label>
      <input id="name" type="text" autocomplete="off" />

      <ul class="notes" id="notes"></ul>

      <button type="submit" id="create">Create workspace</button>
      <div class="status" id="result"></div>
    </form>

    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
